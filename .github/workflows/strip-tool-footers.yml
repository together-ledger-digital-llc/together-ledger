# Removes AI-tool attribution footers from issues, comments and reviews the
# moment they appear (CLAUDE.md, "Branch naming and attribution"). Some
# tooling appends one server-side after the text is written, and puts it back
# on any edit made through the same tooling, so asking the author not to add
# it isn't enough on its own.
#
# It only ever deletes the footer lines themselves: a "---" rule followed by
# a "Generated by/with [Claude Code](…)" line, a bare "🤖 Generated with …"
# line, or a line that is nothing but a claude.ai/code session link. Every
# other character is left alone. Edits made with GITHUB_TOKEN don't trigger
# workflows, so a cleaned body can't loop back into this.
#
# Nothing is checked out and no text is ever executed; bodies are only read
# from the event payload (or the API, when run by hand) and passed through a
# regex. tests/strip-tool-footers.test.js pins the regexes and these
# properties.
#
# Copied from Green Light's workflow of the same name, with one difference:
# it does not run when a pull request is opened or edited. The Attribution
# workflow (scripts/check-attribution.mjs --strip-pr-body) already removes the
# footer from a PR body on those events and then checks it; two workflows
# writing the same PR body from the same payload would race, and whichever
# wrote last would win. A run by hand still cleans PR bodies, which nothing
# else is writing at that moment.
#
# Run it by hand (Actions → Strip tool footers → Run workflow) to clean up
# everything that already exists.

name: Strip tool footers

on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created, edited]
  pull_request_review:
    types: [submitted, edited]
  pull_request_review_comment:
    types: [created, edited]
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: strip-tool-footers-${{ github.event.pull_request.number || github.event.issue.number || github.run_id }}

jobs:
  strip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const FOOTERS = [
              // ---\n_Generated by [Claude Code](https://claude.ai/code…)_
              /\n*[ \t]*-{3,}[ \t]*\n+[ \t]*_?Generated (?:by|with) \[Claude Code\]\([^)\n]*\)_?[ \t]*(?=\n|$)/gi,
              // 🤖 Generated with [Claude Code](https://claude.com/claude-code)
              /\n*[ \t]*(?:🤖[ \t]*)?_?Generated (?:by|with) \[Claude Code\]\([^)\n]*\)_?[ \t]*(?=\n|$)/gi,
              // A line that is only a session link.
              /\n*[ \t]*<?https:\/\/claude\.ai\/code\/session_[A-Za-z0-9]+>?[ \t]*(?=\n|$)/g,
            ];

            function strip(text) {
              if (!text) return text;
              let out = text;
              for (const re of FOOTERS) out = out.replace(re, '');
              return out === text ? text : out.replace(/\s+$/, '');
            }

            const { owner, repo } = context.repo;
            let cleaned = 0;

            async function clean(kind, id, body, update) {
              const next = strip(body);
              if (next === body) return;
              await update(next);
              cleaned++;
              core.info(`Removed a tool footer from ${kind} ${id}`);
            }

            const cleanIssue = (i) =>
              clean(i.pull_request ? 'PR' : 'issue', `#${i.number}`, i.body, (body) =>
                github.rest.issues.update({ owner, repo, issue_number: i.number, body }));
            const cleanComment = (c) =>
              clean('comment', c.id, c.body, (body) =>
                github.rest.issues.updateComment({ owner, repo, comment_id: c.id, body }));
            const cleanReviewComment = (c) =>
              clean('review comment', c.id, c.body, (body) =>
                github.rest.pulls.updateReviewComment({ owner, repo, comment_id: c.id, body }));
            const cleanReview = (number, r) =>
              clean('review', r.id, r.body, (body) =>
                github.rest.pulls.updateReview({ owner, repo, pull_number: number, review_id: r.id, body }));

            const p = context.payload;
            switch (context.eventName) {
              case 'issues':
                await cleanIssue(p.issue);
                break;
              case 'issue_comment':
                await cleanComment(p.comment);
                break;
              case 'pull_request_review':
                await cleanReview(p.pull_request.number, p.review);
                break;
              case 'pull_request_review_comment':
                await cleanReviewComment(p.comment);
                break;
              case 'workflow_dispatch': {
                const all = (method, params) => github.paginate(method, { owner, repo, per_page: 100, ...params });
                for (const i of await all(github.rest.issues.listForRepo, { state: 'all' })) await cleanIssue(i);
                for (const c of await all(github.rest.issues.listCommentsForRepo, {})) await cleanComment(c);
                for (const c of await all(github.rest.pulls.listReviewCommentsForRepo, {})) await cleanReviewComment(c);
                for (const pr of await all(github.rest.pulls.list, { state: 'all' })) {
                  for (const r of await all(github.rest.pulls.listReviews, { pull_number: pr.number })) {
                    await cleanReview(pr.number, r);
                  }
                }
                break;
              }
            }
            core.info(`Cleaned ${cleaned} item(s).`);
