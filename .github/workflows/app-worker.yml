name: Deliver reviewed main to the app Worker

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: app-worker-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    environment:
      name: app
      url: https://app.together-ledger.com
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run check
      - name: Assemble the reviewed public bundle
        env:
          TOGETHER_LEDGER_RELEASE_REVISION: ${{ github.event.workflow_run.head_sha }}
        run: npm run build:public
      - name: Validate Worker packaging
        run: ./node_modules/.bin/wrangler deploy --dry-run --config wrangler.jsonc
      - name: Publish the reviewed public bundle
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TOGETHER_LEDGER_RELEASE_REVISION: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Cloudflare deployment token is not available to this protected environment."
            exit 1
          fi
          ./node_modules/.bin/wrangler deploy --config wrangler.jsonc --keep-vars --message "Reviewed main $TOGETHER_LEDGER_RELEASE_REVISION frontend"
      - name: Validate external release-probe packaging
        run: ./node_modules/.bin/wrangler deploy --dry-run --config probes/app-release-probe/wrangler.jsonc
      - name: Deploy the external release probe
        id: release_probe
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TOGETHER_LEDGER_RELEASE_REVISION: ${{ github.event.workflow_run.head_sha }}
        run: node scripts/deploy-release-probe.mjs
      - name: Verify the public app revision through the external probe
        env:
          TOGETHER_LEDGER_RELEASE_REVISION: ${{ github.event.workflow_run.head_sha }}
        run: >-
          node scripts/verify-release-probe.mjs
          --probe-url "${{ steps.release_probe.outputs.url }}"
          --revision "$TOGETHER_LEDGER_RELEASE_REVISION"
